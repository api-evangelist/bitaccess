notes: >-
  Bitaccess publishes its first-party client libraries under the npm @bitaccess
  scope. coinlib is the marquee library — a unified Node.js/TypeScript API for
  sending and receiving crypto payments (BTC/ETH/TRON/XRP/LTC/etc.) used across
  Bitaccess BTM and Cash API infrastructure. altavista-client-node is the
  first-party client for the Altavista KYC API. No PyPI/Maven/NuGet/RubyGems/
  crates.io/Packagist first-party packages were found — the stack is TypeScript/Node.
