aid: bitaccess
name: BitAccess
description: >-
  Bitaccess is a Canadian blockchain company (Ottawa, founded 2013, Y Combinator) that builds the
  enterprise software and hardware powering Bitcoin ATM (BTM) operations and fintech businesses in more
  than 15 countries. Its stack includes the Bitaccess BTM operating software, the Cash API for cash-in
  and cash-out crypto transaction flows, and the Catena blockchain suite for publishing complex datasets
  to public or private blockchains via smart contracts. Bitaccess maintains an in-house HD/multisig
  enterprise wallet built for high-velocity applications and publishes first-party open-source client
  libraries under the npm @bitaccess scope and the github.com/bitaccess organization, led by the coinlib
  unified Node.js/TypeScript crypto-payments library. Surfaced as a portfolio company of Pantera Capital.
